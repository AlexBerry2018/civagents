[project]
name = "civ-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "civrealm>=0.1.2",
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "ray>=2.6.3",
    "setuptools<81",
]

[project.scripts]
civ-agents = "civ_agents:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
markers = ["live: требует запущенную Ollama"]
addopts = "-m 'not live'"